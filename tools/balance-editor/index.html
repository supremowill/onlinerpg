<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RPG Balance Editor</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="sidebar">
    <div class="brand">
      <h1>Balance Editor</h1>
    </div>
    
    <button class="save-btn" id="save-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      Save & Push to GitHub
    </button>
    <div id="status-msg" class="status-msg"></div>

    <div class="nav-section">
      <h3>PLAYER</h3>
      <ul id="player-nav">
        <li class="active" data-target="player">Base Stats & Skills</li>
      </ul>
    </div>
    
    <div class="nav-section">
      <h3>ENEMIES</h3>
      <ul id="enemies-nav">
        <!-- Enemy list populated dynamically -->
      </ul>
    </div>

    <div class="nav-section">
      <h3>UPDATES & NEWS</h3>
      <ul id="updates-nav">
        <li data-target="updates">Manage Updates</li>
      </ul>
    </div>
  </div>

  <div class="main-content">
    <div id="editor-container" class="editor-container">
      <div class="empty-state">Loading data...</div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
