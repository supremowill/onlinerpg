services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: survival
      POSTGRES_PASSWORD: survival_secret
      POSTGRES_DB: survival_game
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survival -d survival_game"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://survival:survival_secret@db:5432/survival_game?sslmode=disable
      - JWT_SECRET=sua_chave_jwt_super_secreta_123456
      - WEEKLY_AWARD_SECRET=sua_chave_jwt_super_secreta_123456
    volumes:
      - ./client:/app/public
      - ./persistent-data/game_data.json:/app/game_data.json
      - ./persistent-data/item_images.json:/app/public/item_images.json
      - ./persistent-data/item_names.json:/app/public/item_names.json
      - ./persistent-data/item_drop_rates.json:/app/public/item_drop_rates.json
      - ./persistent-data/items:/app/public/items
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  website:
    build:
      context: .
      dockerfile: Dockerfile.website
    ports:
      - "8080:80"
    volumes:
      - ./myaac-main:/var/www/html
      - ./persistent-data/updates.json:/var/www/html/updates.json
      - ./persistent-data/game_data.json:/var/www/html/game_data.json
      - ./persistent-data/item_images.json:/var/www/html/item_images.json
      - ./persistent-data/item_names.json:/var/www/html/item_names.json
      - ./persistent-data/item_drop_rates.json:/var/www/html/item_drop_rates.json
      - ./persistent-data/items:/var/www/html/items
      - ./persistent-data/backups:/var/www/persistent-backups

    environment:
      - DATABASE_URL=postgresql://survival:survival_secret@db:5432/survival_game?sslmode=disable
      - JWT_SECRET=sua_chave_jwt_super_secreta_123456
      - WEEKLY_AWARD_SECRET=sua_chave_jwt_super_secreta_123456
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - website
    restart: unless-stopped

volumes:
  pgdata:
