services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: survival
      POSTGRES_PASSWORD: survival_secret
      POSTGRES_DB: survival_game
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survival -d survival_game"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://survival:survival_secret@db:5432/survival_game?sslmode=disable
      - JWT_SECRET=sua_chave_jwt_super_secreta_123456
    volumes:
      - ./server/game_data.json:/app/game_data.json
      - ./server/dist:/app/dist
      - ./client:/app/public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  website:
    build:
      context: .
      dockerfile: Dockerfile.website
    ports:
      - "8080:80"
    volumes:
      - ./myaac-main:/var/www/html
      - ./client/updates.json:/var/www/html/updates.json
      - ./server/game_data.json:/var/www/html/game_data.json
    environment:
      - DATABASE_URL=postgresql://survival:survival_secret@db:5432/survival_game?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
